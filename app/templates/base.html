<!DOCTYPE html>
<html lang="en" data-paper="cream" data-type="prophet">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}CCChatShare{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='newspaper.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <div id="root">
    <div class="page">
      <header class="cc-masthead">
        <a href="{{ url_for('public.index') }}"><div class="title">CCChatShare</div></a>
        <div class="motto">A private dispatch, sealed for one recipient.</div>
      </header>

      {% block content %}{% endblock %}

      <footer class="footer">CCChatShare &middot; private link, not indexed</footer>
    </div>
  </div>
</body>
</html>
